<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="vulnlookup">
  <title>vulnlookup</title>
  <desc>A radar sweep inside a shield: it listens, it does not probe. Passive CVE, CPE, EPSS and KEV lookup.</desc>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shield-clip">
      <path d="M100 22 L164 46 V104 C164 140 134 166 100 180 C66 166 36 140 36 104 V46 Z"/>
    </clipPath>
  </defs>
  <rect width="640" height="200" rx="18" fill="#0B0D10"/>
  <!-- shield -->
  <path d="M100 22 L164 46 V104 C164 140 134 166 100 180 C66 166 36 140 36 104 V46 Z" fill="#14181D" stroke="#252C34" stroke-width="3"/>
  <g clip-path="url(#shield-clip)">
    <!-- radar rings -->
    <circle cx="100" cy="104" r="22" fill="none" stroke="#3B4148" stroke-width="2"/>
    <circle cx="100" cy="104" r="44" fill="none" stroke="#3B4148" stroke-width="2"/>
    <circle cx="100" cy="104" r="66" fill="none" stroke="#3B4148" stroke-width="2"/>
    <line x1="100" y1="30" x2="100" y2="178" stroke="#3B4148" stroke-width="1.5"/>
    <line x1="26" y1="104" x2="174" y2="104" stroke="#3B4148" stroke-width="1.5"/>
    <!-- the sweep: a quarter wedge, orange -->
    <path d="M100 104 L100 34 A70 70 0 0 1 170 104 Z" fill="url(#sweep)"/>
    <line x1="100" y1="104" x2="100" y2="34" stroke="#FF6B1A" stroke-width="3" stroke-linecap="round"/>
    <!-- three echoes: one confirmed (acid), two outside the sweep (grey) -->
    <circle cx="131" cy="76" r="5.5" fill="#B8FF3C"/>
    <circle cx="131" cy="76" r="10" fill="none" stroke="#B8FF3C" stroke-width="1.5" opacity="0.6"/>
    <circle cx="72" cy="128" r="4" fill="#5A6068"/>
    <circle cx="118" cy="142" r="4" fill="#5A6068"/>
  </g>
  <circle cx="100" cy="104" r="4" fill="#D8DEE6"/>
  <!-- wordmark; textLength pins the layout whatever monospace font the viewer has -->
  <text x="200" y="104" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="54" font-weight="600" fill="#D8DEE6" textLength="400" lengthAdjust="spacingAndGlyphs">vuln<tspan fill="#FF6B1A">lookup</tspan></text>
  <text x="202" y="138" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="15" fill="#8A94A2" textLength="400" lengthAdjust="spacingAndGlyphs">CVE · CPE · EPSS · KEV — passive, verified, deterministic</text>
  <text x="202" y="166" font-family="'IBM Plex Mono','JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="13" fill="#5A6068" textLength="400" lengthAdjust="spacingAndGlyphs">$ vulnlookup product "apache httpd 2.4.49" --kev  <tspan fill="#B8FF3C">EXACT</tspan></text>
</svg>
