name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<10"
      - name: offline test suite (no network)
        run: python -m pytest -q
        env:
          VULNLOOKUP_OFFLINE: "1"
      - name: the CLI runs from a fresh checkout
        run: python skills/vulnlookup/scripts/vulnlookup.py --version
      - name: shell scripts parse
        if: runner.os == 'Linux'
        run: bash -n install.sh
