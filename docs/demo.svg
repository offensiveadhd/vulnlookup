<text x="500" y="20" text-anchor="middle" fill="#8A94A2" font-size="12">vulnlookup — passive CVE / CPE / EPSS / KEV lookup</text>
<g class="f f0">
<text x="16" y="60" fill="#B8FF3C">$ <tspan fill="#D8DEE6">vulnlookup cve CVE-2021-44228 --format brief --style terse</tspan></text>
<g class="f o0">
<text x="16" y="78" fill="#FF8A4A" xml:space="preserve">CVE-2021-44228  10.0 CRIT  EPSS 0.999  KEV+ransomware</text>
</g></g>
<g class="f f1">
<text x="16" y="60" fill="#B8FF3C">$ <tspan fill="#D8DEE6">vulnlookup product &quot;apache httpd 2.4.49&quot; --kev --poc --style terse</tspan></text>
