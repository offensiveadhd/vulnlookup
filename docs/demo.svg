<g class="f o2">
<text x="16" y="78" fill="#C8D0DA" xml:space="preserve">Subject: apache httpd 2.4.49 -&gt; a:apache:http_server (via alias); version in the NVD dictionary</text>
<text x="16" y="96" fill="#FF8A4A" xml:space="preserve">3 CVE(s) confirmed against the subject: 3 critical, 0 high; 3 in CISA KEV; 3 with EPSS &gt;= 0.1.</text>
<text x="16" y="114" fill="#C8D0DA" xml:space="preserve">Act first:</text>
<text x="16" y="132" fill="#FF8A4A" xml:space="preserve">  - CVE-2021-41773 (9.8 CRIT, EPSS 0.999, KEV)</text>
<text x="16" y="150" fill="#FF8A4A" xml:space="preserve">  - CVE-2021-42013 (9.8 CRIT, EPSS 0.999, KEV)</text>
<text x="16" y="168" fill="#FF8A4A" xml:space="preserve">  - CVE-2024-38475 (9.1 CRIT, EPSS 0.999, KEV): upgrade to 2.4.60</text>
