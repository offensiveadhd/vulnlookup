in the NVD dictionary (typed as given; only range criteria can match i", "[exit 4]"], "hold": 3.5}, {"cmd": "VULNLOOKUP_NO_ALIAS=1 vulnlookup resolve gitlab", "lines": ["ambiguous: 'gitlab' matches 8 products in the NVD dictionary. Pick one with --pick part:vendor:product, or ask which was mea", "  1.00  a:gitlab:gitlab                                  GitLab                                   product name is exactly wh", "  1.00  a:jenkins:gitlab                                 Jenkins GitLab                           product name is exactly wh", "  0.69  a:gitlab:gitlab-vscode-extension                 Gitlab Gitlab-vscode-extension           your words are part of a l", "  0.68  a:gitlab:gitlab-shell                            gitlab gitlab-shell                      your words are part of a l", "  0.68  a:gitlab::api::v4_project:gitlab::api::v4        GitLab::API::v4 Project GitLab::API::v4  your words are part of a l", "  0.65  a:gitlab:gitlab_runner                           Gitlab Runner                            your words are part of a l", "  0.64  a:jenkins:gitlab_authentication                  Jenkins Gitlab Authentication            your words are part of a l", "  0.63  a:jenkins:gitlab_oauth                           Jenkins GitLab OAuth for Jenkins         your words are part of a l", "{", "\u2026 76 more line(s)"], "hold": 5.0}, {"cmd": "vulnlookup product \"openssl 1.1.1\" --severity CRITICAL --recommend --format md --limit 2", "lines": ["## openssl 1.1.1 -> a:openssl:openssl (via alias); version in the NVD dictionary", "", "| CVE | CVSS | EPSS | KEV | Exploit | Published | CWE | Match | Matched criteria |", "|---|---|---|---|---|---|---|---|---|", "| CVE-2021-3711 | 9.8 CRIT | 0.878 | - | none | 2021-08-24 | CWE-120 | RANGE | cpe:2.3:a:openssl:openssl:*:*:*:*:*:*:*:* [>=", "", "### CVE-2021-3711", "", "- CVSS 3.1 9.8 CRITICAL  CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H", "- EPSS 0.878 (percentile 0.997, 2026-11-01)", "- CWE CWE-120", "- matched cpe:2.3:a:openssl:openssl:*:*:*:*:*:*:*:*  [>= 1.1.1 < 1.1.1l]", "- fixed in 1.1.1l", "- exploit evidence: no-public-evidence", "- remediation:", "  - Upgrade openssl openssl to 1.1.1l or later (the first version the NVD's vulnerable ranges exclude).", "  - Apply the patch: https://www.oracle.com/security-alerts/cpuapr2022.html", "  - Apply the patch: https://www.oracle.com/security-alerts/cpujan2022.html", "  - Apply the patch: https://www.oracle.com/security-alerts/cpuoct2021.html", "  - Follow the vendor advisory: https://www.openssl.org/news/secadv/20210824.txt", "- In order to decrypt SM2 encrypted data an application is expected to call the API function EVP_PKEY_decrypt(). Typically a", "", "Not counted (shown with --include-unverified): PLATFORM 1"], "hold": 7.0}, {"cmd": "vulnlookup key status", "lines": ["NVD API key: none; requests are paced at 5 per 30 s. Get one at https://nvd.nist.gov/developers/request-an-api-key"], "hold": 2.5}];const t=document.getElementById('t');const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const cls=l=>/CRIT|KEV|^ambiguous/.test(l)?'h':/^\[exit|^Not counted|^note:/.test(l)?'g':/EXACT|RANGE|exact dictionary/.test(l)?'ok':'';async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}async function play(){for(;;){for(const f of F){let typed='';t.innerHTML='<span class=p>$ </span>';for(const ch of f.cmd){typed+=ch;t.innerHTML='<span class=p>$ </span><span class=c>'+esc(typed)+'</span>▌';await sleep(35)}await sleep(400);t.innerHTML='<span class=p>$ </span><span class=c>'+esc(f.cmd)+'</span>\n'+f.lines.map(l=>'<span class="'+cls(l)+'">'+esc(l)+'</span>').join('\n');await sleep(f.hold*1000)}}}play();</script>
