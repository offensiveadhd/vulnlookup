[project]
name = "vulnlookup"
version = "1.0.0"
description = "Passive CVE / CPE / EPSS / KEV lookup skill for AI agents: deterministic, dependency-free, zero false positives by construction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "S603", "S607", "SIM108", "B905", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"docs/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
